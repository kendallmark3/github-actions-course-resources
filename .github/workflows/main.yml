name: Build and Test Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('Code/04 Artifacts & Outputs/03 Finished Project/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        working-directory: Code/04 Artifacts & Outputs/03 Finished Project

      - name: Build website
        run: npm run build
        working-directory: Code/04 Artifacts & Outputs/03 Finished Project

      - name: Debug: Check 'dist' folder contents and path
        run: |
          echo "--- Current Working Directory ---"
          pwd
          echo "--- Contents of 'dist' folder ---"
          ls -F dist/ || echo "dist folder not found"
          echo "--- Absolute path to 'dist' ---"
          if [ -d "dist" ]; then realpath dist; else echo "dist does not exist"; fi
          echo "--- Recursive listing ---"
          ls -R
        working-directory: Code/04 Artifacts & Outputs/03 Finished Project

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: Code/04 Artifacts & Outputs/03 Finished Project/dist
          if-no-files-found: warn
          compression-level: 6
          overwrite: false
          include-hidden-files: false

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('Code/04 Artifacts & Outputs/03 Finished Project/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        working-directory: Code/04 Artifacts & Outputs/03 Finished Project

      - name: Lint code
        run: npm run lint
        working-directory: Code/04 Artifacts & Outputs/03 Finished Project

      - name: Test code
        run: npm run test
        working-directory: Code/04 Artifacts & Outputs/03 Finished Project
