# .github/workflows/main.yml - Workflow with Build and Test jobs (and Debugging for dist)
name: Build and Test Workflow

on:
  push:
    branches:
      - main # This workflow runs when code is pushed to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './Code/04 Artifacts & Outputs/03 Finished Project' # Your specified subdirectory
    steps:
      - name: Get code
        uses: actions/checkout@v3 # Checks out your repository's code

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      # --- CRITICAL DEBUG STEP - DO NOT REMOVE THIS ---
      - name: Debug: Check 'dist' folder contents and path
        run: |
          echo "--- Current Working Directory for this job step ---"
          pwd
          echo ""
          echo "--- Contents of Current Working Directory ---"
          ls -F
          echo ""
          echo "--- Contents of 'dist' folder (if found) ---"
          ls -F dist/ || echo "Error: 'dist' folder not found or is empty at this location!"
          echo ""
          echo "--- Absolute path to 'dist' folder (if exists) ---"
          if [ -d "dist" ]; then realpath dist; else echo "'dist' folder does not exist."; fi
          echo ""
          echo "--- Recursive listing from Current Working Directory ---"
          ls -R
      # --- END CRITICAL DEBUG STEP ---

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
          if-no-files-found: warn
          compression-level: 6
          overwrite: false
          include-hidden-files: false

  test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './Code/04 Artifacts & Outputs/03 Finished Project'
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Test code
        run: npm run test
