build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.publish.outputs.script-file }}
    defaults:
      run:
        working-directory: './Code/04 Artifacts & Outputs/03 Finished Project' # This is where 'npm run build' runs from
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      # --- ADD THESE NEW DEBUG STEPS HERE ---
      - name: Debug: List files in working directory after build
        run: |
          echo "Listing contents of the current working directory:"
          pwd # Print current working directory
          ls -F  # List files and directories, showing trailing slashes for dirs
          echo ""
          echo "Listing contents of 'dist' if it exists:"
          ls -F dist/ || echo "dist directory does not exist or is empty"
          echo ""
          echo "Recursive listing from current working directory:"
          ls -R
      # --- END NEW DEBUG STEPS ---

      - name: Publish JS filename
        id: publish
        run: find dist/assets/*.js -type f -execdir echo 'script-file={}' >> $GITHUB_OUTPUT ';'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
          if-no-files-found: warn
          compression-level: 6
          overwrite: false
          include-hidden-files: false